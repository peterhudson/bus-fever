<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sarah's Bus Jam</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bus Jam">
<meta name="theme-color" content="#e7ecf3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #e7ecf3;
    --ink: #1e293b;
    --blue: #2563eb;
    --blue-d: #1e40af;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; touch-action: none;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 6px) 12px 6px;
  }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none;
    background: linear-gradient(#3b82f6, #1d4ed8); color: #fff; font-size: 22px; font-weight: 800;
    box-shadow: 0 3px 0 #1e3a8a, 0 4px 10px rgba(0,0,0,.2);
  }
  .round:active { transform: translateY(2px); box-shadow: 0 1px 0 #1e3a8a; }
  #title { flex: 1; text-align: center; }
  #themeName { font-size: 10px; font-weight: 800; letter-spacing: 1.4px; color: #526475; margin-bottom: 2px; text-transform: uppercase; }
  #lvl { font-size: 24px; font-weight: 900; letter-spacing: .5px; color: #fff;
    -webkit-text-stroke: 1.5px #0f172a; paint-order: stroke fill; text-shadow: 0 2px 0 #0f172a; }
  #lvl .hard { font-size: 13px; vertical-align: middle; color: #fff; background: #dc2626; -webkit-text-stroke: 0; text-shadow: none;
    padding: 2px 7px; border-radius: 8px; letter-spacing: 1px; position: relative; top: -3px; }
  #sub { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 3px; }
  #prog { height: 7px; width: 45%; max-width: 160px; background: #cbd5e1; border-radius: 4px; overflow: hidden; }
  #progFill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #16a34a); transition: width .2s; }
  #coins { font-weight: 800; font-size: 14px; background: #fff; padding: 1px 9px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  #playfield { position: relative; flex: 1; min-height: 0; }
  #game { width: 100%; height: 100%; display: block; touch-action: none; }
  .scene-control { position: absolute; top: var(--control-top, 110px); z-index: 2; }
  #powerDock { left: 6px; }
  #btnShop { right: 6px; }
  .scene-button {
    width: 48px; min-height: 52px; border: 2px solid #fff; border-radius: 15px; padding: 5px 1px;
    background: linear-gradient(#f8fcff, #d9edff); color: #254d78;
    box-shadow: 0 3px 0 #90aac1, 0 5px 10px #183c5525;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font: 800 9px -apple-system, sans-serif; cursor: pointer;
  }
  .scene-button .ic { font-size: 23px; line-height: 26px; }
  .scene-button > span:last-child { font-size: 8px; white-space: nowrap; }
  .scene-button:active { transform: translateY(2px); box-shadow: 0 1px 0 #90aac1; }
  .scene-button[aria-expanded="true"], .scene-button.active { background: linear-gradient(#fff3b0, #ffd46d); color: #785118; }
  #btnShop { background: linear-gradient(#fff9df, #ffe3a4); color: #785118; box-shadow: 0 3px 0 #bd9b5f, 0 5px 10px #183c5525; }
  .power-panel {
    position: absolute; top: 62px; left: 0; width: 224px; padding: 10px; border-radius: 18px;
    background: #f8fbff; border: 2px solid #fff; box-shadow: 0 8px 30px #18304440;
    animation: pop .15s ease-out; transform-origin: 22px 0;
  }
  .power-panel[hidden] { display: none; }
  .power-panel h2 { margin: 1px 6px 8px; font-size: 14px; color: #334155; }
  .boost {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; margin-top: 6px; padding: 8px;
    border: 1px solid #dbe5f0; border-radius: 12px; background: #fff; color: #25415d; text-align: left; cursor: pointer;
  }
  .boost .ic { font-size: 25px; }
  .boost .labels { flex: 1; }
  .boost .lbl { display: block; font-size: 13px; font-weight: 800; }
  .boost small { display: block; margin-top: 2px; font-size: 10px; color: #63768b; }
  .boost .cnt { min-width: 28px; padding: 5px; border-radius: 9px; background: #e1f4e5; color: #26643c; text-align: center; font-size: 14px; }
  .boost .cnt.zero { background: #f1f5f9; color: #64748b; }
  .boost.active { background: #fff3bd; border-color: #e6bc50; }
  button:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  #toast {
    position: fixed; left: 50%; top: 58%; transform: translate(-50%, -50%); z-index: 5;
    background: rgba(15,23,42,.85); color: #fff; padding: 10px 16px; border-radius: 14px;
    font-weight: 700; font-size: 15px; text-align: center; max-width: 80vw;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #modal { position: fixed; inset: 0; z-index: 10; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #modal[hidden] { display: none; }
  .card {
    max-height: calc(100dvh - 32px); overflow-y: auto; touch-action: pan-y;
    width: 100%; max-width: 340px; background: #fff; border-radius: 22px; padding: 20px 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3); text-align: center; animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h2 { margin: 0 0 6px; font-size: 26px; font-weight: 900; }
  .card p { margin: 6px 0 14px; font-size: 15px; color: #475569; line-height: 1.4; }
  .card .big { font-size: 46px; margin: 4px 0; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px; padding: 13px; margin-top: 10px;
    font-size: 17px; font-weight: 800; color: #fff; background: linear-gradient(#22c55e, #16a34a); box-shadow: 0 3px 0 #15803d;
  }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn.blue { background: linear-gradient(#3b82f6, #1d4ed8); box-shadow: 0 3px 0 #1e3a8a; }
  .btn.gray { background: linear-gradient(#94a3b8, #64748b); box-shadow: 0 3px 0 #475569; }
  .btn.gold { background: linear-gradient(#fbbf24, #f59e0b); box-shadow: 0 3px 0 #b45309; }
  .btn:disabled { opacity: .45; }
  .shop-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #e2e8f0; text-align: left; }
  .shop-row .ic { font-size: 28px; width: 36px; text-align: center; }
  .shop-row .txt { flex: 1; font-size: 14px; color: #475569; }
  .shop-row .txt b { display: block; color: var(--ink); font-size: 16px; }
  .shop-row button { border: 0; border-radius: 12px; padding: 9px 12px; font-weight: 800; font-size: 15px; color: #fff; background: linear-gradient(#fbbf24, #f59e0b); box-shadow: 0 2px 0 #b45309; white-space: nowrap; }
  .shop-row button:disabled { opacity: .4; }
  .coinline { font-weight: 800; font-size: 18px; margin-bottom: 4px; }
  .howto { text-align: left; font-size: 15px; color: #334155; line-height: 1.45; padding-left: 20px; margin: 8px 0 4px; }
  .howto li { margin-bottom: 6px; }
  .pt-note { font-size: 13px; color: #475569; margin: 4px 0 8px; }
  .pt-list { max-height: 52vh; overflow-y: auto; margin-bottom: 8px; }
  .pt-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid #e2e8f0; }
  .pt-row span { flex: 1; text-align: left; font-size: 14px; font-weight: 700; color: #334155; }
  .pt-level { min-width: 46px; padding: 7px 0; border: 0; border-radius: 10px; background: #e0e7ff; color: #1e3a8a; font: 800 14px -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="round" id="btnRestart" aria-label="Restart level">⟳</button>
    <div id="title">
      <div id="themeName"></div>
      <div id="lvl">LEVEL 1</div>
      <div id="sub"><div id="prog"><div id="progFill"></div></div><div id="coins">🪙 0</div></div>
    </div>
    <button class="round" id="btnMenu" aria-label="Menu">❚❚</button>
  </header>
  <div id="playfield">
    <canvas id="game"></canvas>
    <div id="powerDock" class="scene-control">
      <button id="btnBoosters" class="scene-button" aria-label="Power-ups" aria-expanded="false" aria-controls="powerPanel"><span class="ic" aria-hidden="true">⚡</span><span>Power-ups</span></button>
      <div id="powerPanel" class="power-panel" role="group" aria-labelledby="powerTitle" hidden>
        <h2 id="powerTitle">Power-ups</h2>
        <button class="boost" data-k="vip"><span class="ic" aria-hidden="true">⭐</span><span class="labels"><span class="lbl">VIP</span><small>Fly a bus to the VIP bay</small></span><b class="cnt">0</b></button>
        <button class="boost" data-k="shuffle"><span class="ic" aria-hidden="true">🔀</span><span class="labels"><span class="lbl">Shuffle</span><small>Mix up bus colours</small></span><b class="cnt">0</b></button>
        <button class="boost" data-k="sort"><span class="ic" aria-hidden="true">👥</span><span class="labels"><span class="lbl">Sort</span><small>Bring matching riders forward</small></span><b class="cnt">0</b></button>
      </div>
    </div>
    <button class="scene-button scene-control" id="btnShop" aria-label="Shop"><span class="ic" aria-hidden="true">🏪</span><span>Shop</span></button>
  </div>
</div>
<div id="toast"></div>
<div id="modal" hidden><div class="card" id="card"></div></div>
<script src="scenery.js"></script>
<script src="advanced.js"></script>
<script src="parade-art.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
